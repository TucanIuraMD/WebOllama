<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>WebOllama — Panel</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script src="/js/vendor/chart.umd.min.js"></script>
  <script src="/js/vendor/marked.min.js"></script>
  <script src="/js/vendor/purify.min.js"></script>
</head>
<body>
  <!-- Login Overlay -->
  <div id="login-overlay" class="login-overlay" style="display:none">
    <div class="login-card">
      <h1>WebOllama</h1>
      <p class="login-subtitle">Ollama Management Panel</p>
      <div id="login-error" class="login-error" style="display:none"></div>
      <input type="text" id="login-user" placeholder="Username" autocomplete="username" />
      <input type="password" id="login-pass" placeholder="Password" autocomplete="current-password" />
      <button onclick="login()">Sign In</button>
      <p class="login-hint">Default: admin / changeme</p>
    </div>
  </div>

  <!-- App Shell -->
  <div id="app" style="display:none">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo">⛁ WebOllama</span>
        <span class="topbar-status" id="ollama-indicator">● <span id="ollama-status-text">checking...</span></span>
      </div>
      <div class="topbar-right">
        <span id="gpu-indicator" class="topbar-gpu" style="display:none"></span>
        <span id="user-display" class="topbar-user"></span>
        <button onclick="logout()" class="btn-ghost" title="Logout">🚪</button>
      </div>
    </header>

    <!-- Sidebar + Main -->
    <div class="layout">
      <nav class="sidebar" id="sidebar">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">📊 Dashboard</a>
        <a href="#models" class="nav-item" data-page="models">📦 Models</a>
        <a href="#agents" class="nav-item" data-page="agents">🤖 Agents</a>
        <a href="#running" class="nav-item" data-page="running">▶ Running</a>
        <a href="#jobs" class="nav-item" data-page="jobs">⚙ Jobs</a>
        <hr class="nav-divider" />
        <a href="#system" class="nav-item" data-page="system">🖥 System</a>
        <a href="#gpu" class="nav-item" data-page="gpu">🎮 GPU</a>
        <a href="#electricity" class="nav-item" data-page="electricity">⚡ Electricity</a>
        <a href="#logs" class="nav-item" data-page="logs">📋 Logs</a>
        <a href="#terminal" class="nav-item" data-page="terminal">⌨ Terminal</a>
        <a href="#chat" class="nav-item" data-page="chat">💬 Chat</a>
        <a href="#llm" class="nav-item" data-page="llm">🔌 LLM API</a>
        <hr class="nav-divider" />
        <a href="#settings" class="nav-item" data-page="settings">⚙ Settings</a>
      </nav>

      <main class="main" id="main-content">
        <div class="page-loader" id="page-loader">Loading...</div>
        <div id="page-container"></div>
      </main>
    </div>
  </div>

  <!-- Modal / Drawer -->
  <div id="modal-overlay" class="modal-overlay" style="display:none" onclick="closeModal()"></div>
  <div id="modal" class="modal" style="display:none"><div id="modal-body"></div></div>

  <script src="/js/api.js"></script>
  <script src="/js/md.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/pages/charts.js"></script>
  <script src="/js/pages/login.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/models.js"></script>
  <script src="/js/pages/agents.js"></script>
  <script src="/js/pages/running.js"></script>
  <script src="/js/pages/jobs.js"></script>
  <script src="/js/pages/system.js"></script>
  <script src="/js/pages/gpu.js"></script>
  <script src="/js/pages/electricity.js"></script>
  <script src="/js/pages/logs.js"></script>
  <script src="/js/pages/terminal.js"></script>
  <script src="/js/pages/chat.js"></script>
  <script src="/js/pages/llm.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
